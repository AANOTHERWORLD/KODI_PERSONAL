<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-labelledby="t">
  <title id="t">Home of the Internet platform</title>
  <rect width="1600" height="1000" fill="#f4f1ec"/>
  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#1a1a1a">
    <text x="80" y="90" font-size="22" letter-spacing="4" fill="#6b6660">PLATFORM</text>
    <text x="80" y="140" font-size="40">Home of the Internet: globally connected, locally activated.</text>
    <g text-anchor="middle">
      <text x="800" y="470" font-size="46">Home of the Internet</text>
      <text x="800" y="510" font-size="20" fill="#6b6660">Hometown pride is what a community puts into the world</text>
    </g>
    <g font-size="24" text-anchor="middle">
