<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-labelledby="t">
  <title id="t">Two cities, one identity: four principles</title>
    <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#404040">
    <text x="80" y="90" font-size="22" letter-spacing="4" fill="#6f6f6f">PRINCIPLES</text>
    <text x="80" y="140" font-size="40">Two cities, one identity.</text>
    <g font-size="30" text-anchor="middle">
      <text x="400" y="330">San Francisco</text><text x="400" y="364" font-size="18" fill="#6f6f6f">Relaxed Californian ease</text>
      <text x="1200" y="330">Tokyo</text><text x="1200" y="364" font-size="18" fill="#6f6f6f">Omotenashi, the art of anticipation</text>
      <text x="800" y="520" font-size="34">One identity</text>
    </g>
    <g font-size="24">
      <text x="160" y="720">1. Harmonize two cultural energies</text><text x="160" y="750" font-size="17" fill="#6f6f6f">Translate without imitating</text>
      <text x="860" y="720">2. Elevate hospitality into a principle</text><text x="860" y="750" font-size="17" fill="#6f6f6f">Anticipation as the clearest signal of care</text>
      <text x="160" y="840">3. Design the office as a social ecosystem</text><text x="160" y="870" font-size="17" fill="#6f6f6f">Flow and rhythm, morning coffee to Friday gatherings</text>
      <text x="860" y="840">4. Let architecture speak before words</text><text x="860" y="870" font-size="17" fill="#6f6f6f">Non-verbal cues carry outsized weight</text>
    </g>
  </g>
  <g stroke="#404040" stroke-width="2" fill="none">
    <circle cx="520" cy="470" r="150"/><circle cx="1080" cy="470" r="150"/>
  </g>
  <circle cx="800" cy="470" r="60" fill="#8c4339" opacity="0.9"/>
</svg>
