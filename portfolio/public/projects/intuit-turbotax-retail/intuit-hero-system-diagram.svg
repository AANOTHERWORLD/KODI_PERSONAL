<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-labelledby="t">
  <title id="t">Hero system: three acts across three tiers</title>
  <rect width="1600" height="1000" fill="#f4f1ec"/>
  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#1a1a1a">
    <text x="80" y="90" font-size="22" letter-spacing="4" fill="#6b6660">HERO SYSTEM</text>
    <text x="80" y="140" font-size="40">Three acts across three tiers. Constant DNA, flexible richness.</text>
    <g font-size="26" text-anchor="middle">
      <text x="560" y="260">The Threshold</text><text x="560" y="292" font-size="18" fill="#6b6660">Bring it in</text>
      <text x="900" y="260">The Handoff</text><text x="900" y="292" font-size="18" fill="#6b6660">Hand it over</text>
      <text x="1240" y="260">The Exhale</text><text x="1240" y="292" font-size="18" fill="#6b6660">Breathe</text>
    </g>
    <g font-size="26">
      <text x="80" y="420">Micro</text><text x="80" y="452" font-size="18" fill="#6b6660">Smallest footprint</text>
      <text x="80" y="620">Compact</text><text x="80" y="652" font-size="18" fill="#6b6660">Mid footprint</text>
      <text x="80" y="820">Core</text><text x="80" y="852" font-size="18" fill="#6b6660">Largest footprint</text>
    </g>
  </g>
  <g stroke="#1a1a1a" stroke-width="2" fill="none">
    <rect x="400" y="330" width="1000" height="600"/>
    <line x1="400" y1="530" x2="1400" y2="530"/><line x1="400" y1="730" x2="1400" y2="730"/>
    <line x1="733" y1="330" x2="733" y2="930"/><line x1="1066" y1="330" x2="1066" y2="930"/>
  </g>
  <!-- DNA marks: same mark in every cell, growing in richness by tier -->
  <g fill="#b5532a">
    <circle cx="566" cy="430" r="14"/><circle cx="900" cy="430" r="14"/><circle cx="1233" cy="430" r="14"/>
    <g><circle cx="566" cy="630" r="14"/><circle cx="566" cy="630" r="34" fill="none" stroke="#b5532a" stroke-width="2"/></g>
    <g><circle cx="900" cy="630" r="14"/><circle cx="900" cy="630" r="34" fill="none" stroke="#b5532a" stroke-width="2"/></g>
    <g><circle cx="1233" cy="630" r="14"/><circle cx="1233" cy="630" r="34" fill="none" stroke="#b5532a" stroke-width="2"/></g>
    <g><circle cx="566" cy="830" r="14"/><circle cx="566" cy="830" r="34" fill="none" stroke="#b5532a" stroke-width="2"/><circle cx="566" cy="830" r="58" fill="none" stroke="#b5532a" stroke-width="2" stroke-dasharray="4 6"/></g>
    <g><circle cx="900" cy="830" r="14"/><circle cx="900" cy="830" r="34" fill="none" stroke="#b5532a" stroke-width="2"/><circle cx="900" cy="830" r="58" fill="none" stroke="#b5532a" stroke-width="2" stroke-dasharray="4 6"/></g>
    <g><circle cx="1233" cy="830" r="14"/><circle cx="1233" cy="830" r="34" fill="none" stroke="#b5532a" stroke-width="2"/><circle cx="1233" cy="830" r="58" fill="none" stroke="#b5532a" stroke-width="2" stroke-dasharray="4 6"/></g>
  </g>
  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" fill="#6b6660">
    <text x="400" y="975">Filled dot: constant DNA, identical in every cell. Rings: richness and scale, which flex with footprint.</text>
  </g>
</svg>
